{% extends "main/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<form method="post">
    {% csrf_token %}
    
    {% if form.non_field_errors %}
        <div>
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    {{ form.as_p }}

    <button type="submit">Сохранить</button>
</form>
{% endblock %}
