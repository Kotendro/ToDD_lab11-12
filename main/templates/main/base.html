{% load static %}

<!DOCTYPE html>
<html lang="ru">

    <title>{% block title %}Админ-панель{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'src/output.css'%}">
</head>
<body>

    <main class="container mx-auto px-4 py-6">

</html>
